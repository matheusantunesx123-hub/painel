<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Comando" />
  <title>Matheus Gabriel · Área de Comando</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-gradient: radial-gradient(circle at top, #141e30 0%, #0b0f17 65%);
      --surface: #131a26;
      --surface-hover: #1b2434;
      --surface-active: #222d40;
      --border: #222f46;
      --border-focus: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.14);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.14);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-stack);
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* HEADER */
    header {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 6px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.3;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* BUTTONS */
    button, .btn {
      font-family: inherit;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    button:active, .btn:active {
      transform: scale(0.97);
      background: var(--surface-active);
    }

    button.primary, .btn.primary {
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
    }

    button.icon-only {
      padding: 10px;
      width: 42px;
      height: 42px;
    }

    /* TOOLBAR: SEARCH & CATEGORY FILTERS */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 42px 12px 42px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-height: 46px;
    }

    .search-box input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-box .clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: var(--radius-full);
      display: none;
    }

    /* FILTERS HORIZONTAL SCROLL */
    .filters-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .filters-wrap::-webkit-scrollbar {
      display: none;
    }

    .filters {
      display: flex;
      gap: 8px;
      width: max-content;
      padding: 2px 2px;
    }

    .chip {
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      transition: all 0.15s ease;
    }

    .chip:active {
      transform: scale(0.95);
    }

    .chip.active {
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.45);
      color: var(--accent);
    }

    /* CARDS GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }

    .card:active {
      transform: scale(0.985);
      background: var(--surface-active);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge.ready {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .badge.category {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-body h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-body h2 .ext-icon {
      color: var(--muted);
      opacity: 0.6;
      flex-shrink: 0;
    }

    .card-body p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 6px;
    }

    .card-foot {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .url-chip {
      font-size: 0.76rem;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 190px;
    }

    .card-btns {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      padding: 6px 10px;
      font-size: 0.76rem;
      min-height: 30px;
      border-radius: var(--radius-sm);
    }

    /* EMPTY STATE */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
    }

    /* FOOTER */
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.7;
    }

    /* MODAL / BOTTOM SHEET (MOBILE-FIRST) */
    dialog {
      margin: auto;
      background: #111827;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: min(500px, 94vw);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
    }

    .form-group input, .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      min-height: 44px;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* RESPONSIVE BREAKPOINTS */
    @media (max-width: 640px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom)) 12px;
      }

      .brand-text h1 {
        font-size: 1.15rem;
      }

      .brand-text p {
        font-size: 0.78rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .card {
        padding: 14px;
      }

      dialog {
        width: 100vw;
        max-width: 100vw;
        margin: auto 0 0 0;
        border-radius: 20px 20px 0 0;
        border-bottom: none;
        padding: 20px 16px max(24px, env(safe-area-inset-bottom)) 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="brand">
          <div class="avatar">MG</div>
          <div class="brand-text">
            <h1 id="page-title">Área de Comando</h1>
            <p id="page-subtitle">Projetos, automações e servidores em nuvem</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="primary" id="btn-add" title="Adicionar atalho">+ Atalho</button>
          <button class="icon-only" id="btn-export" title="Exportar links.json">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="search" type="search" placeholder="Buscar projeto, serviço ou tag..." autocomplete="off" />
          <button type="button" class="clear-btn" id="clear-search">✕</button>
        </div>

        <div class="filters-wrap">
          <div class="filters" id="filters"></div>
        </div>
      </div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      <span>Always Free · Matheus Gabriel · 100% Gratuito</span>
    </footer>
  </div>

  <!-- MODAL EDITAR / NOVO ATALHO -->
  <dialog id="modal">
    <form id="link-form">
      <h3 style="margin-bottom: 14px;" id="modal-title">Novo Atalho</h3>
      <input type="hidden" id="field-id" />
      
      <div class="form-group">
        <label for="field-name">Nome do Projeto / Serviço</label>
        <input id="field-name" required placeholder="Ex: Central de Automação" />
      </div>

      <div class="form-group">
        <label for="field-url">Endereço Web (URL)</label>
        <input id="field-url" type="url" required placeholder="https://..." />
      </div>

      <div class="form-group">
        <label for="field-desc">Descrição Resumida</label>
        <input id="field-desc" placeholder="Ex: Monitoramento e controle" />
      </div>

      <div class="form-group">
        <label for="field-cat">Categoria</label>
        <select id="field-cat">
          <option value="Automação">Automação</option>
          <option value="Servidores">Servidores</option>
          <option value="IA">Inteligência Artificial (IA)</option>
          <option value="Dispositivos">Dispositivos & IoT</option>
          <option value="Projetos">Projetos</option>
          <option value="Código">Código & GitHub</option>
        </select>
      </div>

      <div class="modal-foot">
        <button type="button" id="btn-delete" style="color: var(--danger); margin-right: auto; display: none;">Excluir</button>
        <button type="button" id="btn-cancel">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = "painel_comando_custom_links_v2";

    const ICONS = {
      server: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><circle cx="6" cy="7" r="1"/><circle cx="6" cy="17" r="1"/></svg>`,
      home: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>`,
      workflow: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h4a2 2 0 0 1 2 2v7"/></svg>`,
      brain: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04zm5 0A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"/></svg>`,
      chip: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>`,
      wifi: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>`,
      cloud: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`,
      globe: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>`,
      code: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>`,
      external: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>`
    };

    let baseLinks = [];
    let activeCategory = "Todas";

    function loadLocalOverrides() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveLocalOverrides(map) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
    }

    function getMergedLinks() {
      const overrides = loadLocalOverrides();
      const map = new Map();

      for (const item of baseLinks) {
        const override = overrides[item.id];
        if (override && override._deleted) continue;
        map.set(item.id, override ? { ...item, ...override, _local: true } : { ...item });
      }
      for (const [id, item] of Object.entries(overrides)) {
        if (!item._deleted && !map.has(id)) {
          map.set(id, { ...item, id, _local: true });
        }
      }
      return Array.from(map.values());
    }

    function handleDirectRedirect(links) {
      const params = new URLSearchParams(window.location.search);
      const go = params.get("go") || window.location.hash.replace(/^#go=/, "");
      if (!go) return;
      const target = links.find((l) => l.id === go && l.url);
      if (target) window.location.replace(target.url);
    }

    function renderFilters(links) {
      const categories = ["Todas", ...new Set(links.map((l) => l.category || "Projetos"))];
      const container = document.getElementById("filters");
      container.innerHTML = "";

      for (const cat of categories) {
        const btn = document.createElement("button");
        btn.className = `chip ${activeCategory === cat ? "active" : ""}`;
        btn.textContent = cat;
        btn.onclick = () => {
          activeCategory = cat;
          render();
        };
        container.appendChild(btn);
      }
    }

    function render() {
      const links = getMergedLinks();
      renderFilters(links);

      const q = document.getElementById("search").value.trim().toLowerCase();
      const clearBtn = document.getElementById("clear-search");
      clearBtn.style.display = q ? "block" : "none";

      const filtered = links.filter((item) => {
        const matchCat = activeCategory === "Todas" || (item.category || "Projetos") === activeCategory;
        const matchText =
          !q ||
          item.name.toLowerCase().includes(q) ||
          (item.description || "").toLowerCase().includes(q) ||
          (item.category || "").toLowerCase().includes(q);
        return matchCat && matchText;
      });

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `<h3>Nenhum atalho encontrado</h3><p style="margin-top: 6px;">Tente buscar com outras palavras ou limpe os filtros.</p>`;
        grid.appendChild(empty);
        return;
      }

      for (const item of filtered) {
        const hasUrl = Boolean(item.url && item.url.trim());
        const card = document.createElement("a");
        card.className = "card";
        card.href = hasUrl ? item.url : "#";
        if (hasUrl) {
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        } else {
          card.onclick = (e) => {
            e.preventDefault();
            openModal(item);
          };
        }

        const iconSvg = ICONS[item.icon] || ICONS.globe;

        card.innerHTML = `
          <div class="card-head">
            <div class="icon-box">${iconSvg}</div>
            <div class="badge-group">
              <span class="badge category">${escapeHtml(item.category || "Projetos")}</span>
              <span class="badge ready">Ativo</span>
            </div>
          </div>
          <div class="card-body">
            <h2>
              <span>${escapeHtml(item.name)}</span>
              <span class="ext-icon">${ICONS.external}</span>
            </h2>
            <p>${escapeHtml(item.description || "")}</p>
          </div>
          <div class="card-foot">
            <span class="url-chip">${escapeHtml(item.url ? item.url.replace(/^https?:\/\//, '') : "Sem URL")}</span>
            <div class="card-btns">
              <button type="button" class="mini-btn edit-btn">Editar</button>
            </div>
          </div>
        `;

        card.querySelector(".edit-btn").onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openModal(item);
        };

        grid.appendChild(card);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    const modal = document.getElementById("modal");
    const form = document.getElementById("link-form");

    function openModal(item = null) {
      document.getElementById("modal-title").textContent = item ? `Editar: ${item.name}` : "Novo Atalho";
      document.getElementById("field-id").value = item ? item.id : "";
      document.getElementById("field-name").value = item ? item.name : "";
      document.getElementById("field-url").value = item ? item.url || "" : "";
      document.getElementById("field-desc").value = item ? item.description || "" : "";
      document.getElementById("field-cat").value = item ? (item.category || "Projetos") : "Projetos";
      document.getElementById("btn-delete").style.display = item ? "inline-block" : "none";
      modal.showModal();
    }

    document.getElementById("btn-add").onclick = () => openModal(null);
    document.getElementById("btn-cancel").onclick = () => modal.close();

    document.getElementById("btn-delete").onclick = () => {
      const id = document.getElementById("field-id").value;
      if (!id) return;
      const overrides = loadLocalOverrides();
      overrides[id] = { _deleted: true };
      saveLocalOverrides(overrides);
      modal.close();
      render();
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      const rawId = document.getElementById("field-id").value;
      const name = document.getElementById("field-name").value.trim();
      const id = rawId || name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || `link-${Date.now()}`;
      const overrides = loadLocalOverrides();
      overrides[id] = {
        id,
        name,
        url: document.getElementById("field-url").value.trim(),
        description: document.getElementById("field-desc").value.trim(),
        category: document.getElementById("field-cat").value.trim() || "Projetos",
        icon: "globe"
      };
      saveLocalOverrides(overrides);
      modal.close();
      render();
    };

    document.getElementById("btn-export").onclick = () => {
      const payload = {
        title: "Matheus Gabriel · Área de Comando",
        subtitle: "Central única de acesso a todos os projetos, automações e servidores em nuvem",
        links: getMergedLinks().map(({ _local, ...rest }) => rest)
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "links.json";
      a.click();
    };

    const searchInput = document.getElementById("search");
    searchInput.addEventListener("input", render);
    document.getElementById("clear-search").onclick = () => {
      searchInput.value = "";
      render();
      searchInput.focus();
    };

    async function init() {
      try {
        const res = await fetch("./links.json?v=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const config = await res.json();
          baseLinks = config.links || [];
        }
      } catch (err) {
        console.warn("Usando fallback de dados locais", err);
      }
      handleDirectRedirect(getMergedLinks());
      render();
    }

    init();
  </script>
</body>
</html>
